# Loki + Promtail — Log-Aggregation für den CachyOS-Host.
#
# Loki:    HTTP-API auf :3100, speichert Logs in Named Volume.
# Promtail: liest journald (Host) + Docker-Logs, pusht an Loki.
#
# Beide host-mode (wie Prometheus), damit Promtail->Loki und
# Grafana->Loki ohne Bridge-Routing klappen.
#
# Promtail braucht:
#   - /var/log/journal  (oder /run/log/journal)  als Bind-Mount für journald
#   - /etc/machine-id   für Journal-Tag-Resolution
#   - /var/run/docker.sock  für Container-Discovery + Logs

services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command:
      - '-config.file=/etc/loki/local-config.yaml'

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    network_mode: host
    depends_on:
      - loki
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    command:
      - '-config.file=/etc/promtail/config.yml'

volumes:
  loki-data:
  promtail-positions:
