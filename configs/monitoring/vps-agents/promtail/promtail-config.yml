# Promtail auf VPS → CachyOS-Loki (100.95.132.54:3100).
# Job-Labels mit host=vps damit man Quellen unterscheiden kann.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://100.95.132.54:3100/loki/api/v1/push

scrape_configs:

  - job_name: journal
    journal:
      json: false
      max_age: 12h
      path: /var/log/journal
      labels:
        job: systemd-journal
        host: vps
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'
      - source_labels: ['__journal_priority_keyword']
        target_label: 'level'

  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - target_label: 'host'
        replacement: 'vps'

  # AGH-Querylog. Original-JSON-Zeile bleibt im Body; ad-hoc Filter
  # via `| json` in Grafana. Nur niedrig-kardinale Felder als Labels.
  - job_name: adguard
    static_configs:
      - targets: [localhost]
        labels:
          job: adguard
          host: vps
          __path__: /var/agh-log/querylog.json*
    pipeline_stages:
      - json:
          expressions:
            ts: T
            qtype: QT
            upstream: Upstream
      - labels:
          qtype:
          upstream:
      - timestamp:
          source: ts
          format: RFC3339Nano
