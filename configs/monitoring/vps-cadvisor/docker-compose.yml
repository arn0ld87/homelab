# cadvisor — Container-Metriken auf der VPS.
# Wird von Prometheus auf CachyOS via Tailnet (100.92.62.9:8180) gescraped.
#
# Pattern wie node_exporter: network_mode: host + --port-Flag.
# Damit lauscht cadvisor auf ALLEN Host-Interfaces (inkl. tailscale0).
# Port 8180 statt 8080, da 8080 von Coolify belegt.
#
# Sicherheit: host-mode öffnet :8180 auch auf eth0 — VPS-Firewall
# (UFW/nftables) muss eingehendes :8180 von eth0 blockieren. Tailscale-
# Interface bleibt offen für den CachyOS-Prometheus.

services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    network_mode: host
    command:
      - '--port=8180'
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--enable_metrics=disk,diskIO,network,process'
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8180/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
